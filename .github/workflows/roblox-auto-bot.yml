name: Roblox Limiteds & Stock 24/7 Auto Alert

on:
  schedule:
    # Run automatically every 30 minutes (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto Alert via Cloud API
        env:
          DEV_URL: https://ais-dev-hfkquwqjxd4mbefwduiy6q-4504304529.asia-southeast1.run.app
        run: |
          echo "Triggering Roblox Limiteds Auto Bot at $(date)..."
          curl -X POST "${DEV_URL}/api/roblox/cron" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail || true
